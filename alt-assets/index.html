<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <noscript>
    <meta http-equiv="refresh" content="0; url=?noscript">
  </noscript>
  <link rel="icon" type="image/x-icon" href="__ASSETS_PREFIX__favicon.ico">
  <link rel="stylesheet" href="__ASSETS_PREFIX__index.css">
  <title>Dufs</title>
</head>
<body class="font-sans antialiased">
  <!-- Background gradient -->
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-accent-500/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-1/4 w-80 h-80 bg-accent-600/5 rounded-full blur-3xl"></div>
  </div>

  <!-- Header -->
  <header class="header-bar sticky top-0 z-40 w-full border-b border-surface-800/50 bg-surface-950/80 backdrop-blur-xl">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-14 sm:h-16 gap-3">
        <!-- Breadcrumb -->
        <nav class="breadcrumb flex items-center gap-1.5 min-w-0 flex-1 text-sm sm:text-base font-medium overflow-hidden" aria-label="Breadcrumb">
          <!-- Populated by JS -->
        </nav>

        <!-- Toolbar -->
        <div class="flex items-center gap-1 sm:gap-2 flex-shrink-0">
          <!-- Search bar -->
          <form class="searchbar hidden relative">
            <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-surface-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </div>
            <input 
              id="search" 
              name="q" 
              type="text" 
              maxlength="128" 
              autocomplete="off"
              placeholder="Search..."
              class="w-28 sm:w-48 pl-9 pr-2 py-1.5 text-sm bg-surface-900 border border-surface-700 rounded-lg text-surface-200 placeholder:text-surface-500 focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500/30 focus:w-40 sm:focus:w-56 transition-all"
            >
            <input type="submit" hidden>
          </form>

          <!-- Download folder -->
          <a href="" class="download hidden icon-btn" title="Download" download>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
          </a>

          <!-- Move file (editor page) -->
          <button class="move-file hidden icon-btn" title="Move & Rename" type="button">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
          </button>

          <!-- Delete file (editor page) -->
          <button class="delete-file hidden icon-btn text-danger hover:text-danger" title="Delete" type="button">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          </button>

          <!-- Divider -->
          <div class="toolbox-divider hidden w-px h-6 bg-surface-700 mx-1"></div>

          <!-- Upload files -->
          <div class="upload-file hidden">
            <label for="file" class="icon-btn cursor-pointer inline-flex items-center justify-center" title="Upload files">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
              </svg>
            </label>
            <input type="file" id="file" title="Upload files" name="file" multiple class="sr-only">
          </div>

          <!-- New folder -->
          <button class="new-folder hidden icon-btn" title="New folder" type="button">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            </svg>
          </button>

          <!-- New file -->
          <button class="new-file hidden icon-btn" title="New file" type="button">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
          </button>

          <!-- Save button (editor) -->
          <button class="save-btn hidden btn btn-primary text-sm gap-1.5" title="Save file" type="button">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span class="hidden sm:inline">Save</span>
          </button>

          <!-- Auth buttons -->
          <button class="login-btn hidden icon-btn" title="Login" type="button">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
            </svg>
          </button>

          <button class="logout-btn hidden icon-btn group flex items-center gap-2" title="Logout" type="button">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            <span class="user-name text-sm text-surface-400 group-hover:text-surface-200 hidden sm:inline"></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="main max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <!-- Index page (directory listing) -->
    <div class="index-page hidden animate-fade-in">
      <!-- Empty folder message -->
      <div class="empty-folder hidden">
        <div class="flex flex-col items-center justify-center py-16 sm:py-24 text-center">
          <div class="w-16 h-16 mb-6 rounded-2xl bg-surface-800/50 flex items-center justify-center text-surface-500">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
            </svg>
          </div>
          <p class="text-surface-400 text-lg font-medium empty-text">Empty folder</p>
          <p class="text-surface-500 text-sm mt-1 empty-hint hidden">Drop files here to upload</p>
        </div>
      </div>

      <!-- Upload progress table -->
      <div class="uploaders-table hidden mb-6">
        <div class="card overflow-hidden">
          <div class="px-4 py-3 border-b border-surface-800/50 bg-surface-850/30">
            <h3 class="text-sm font-semibold text-surface-300 flex items-center gap-2">
              <svg class="w-4 h-4 text-accent-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
              </svg>
              Uploading
            </h3>
          </div>
          <div class="uploaders-body divide-y divide-surface-800/50">
            <!-- Upload rows inserted here by JS -->
          </div>
        </div>
      </div>

      <!-- Files table -->
      <div class="paths-table hidden">
        <div class="card overflow-hidden">
          <!-- Table header (desktop only) -->
          <div class="paths-table-head hidden sm:flex items-center gap-2 px-4 py-2.5 border-b border-surface-800/50 bg-surface-850/30 text-xs font-semibold text-surface-500 uppercase tracking-wider">
            <!-- Populated by JS -->
          </div>
          <!-- Table body -->
          <div class="paths-table-body divide-y divide-surface-800/30 stagger-children">
            <!-- Rows inserted here by JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- Editor page -->
    <div class="editor-page hidden animate-fade-in">
      <div class="not-editable hidden">
        <div class="flex flex-col items-center justify-center py-12 text-center">
          <div class="w-14 h-14 mb-4 rounded-xl bg-surface-800/50 flex items-center justify-center text-surface-500">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
          </div>
          <p class="text-surface-400 text-lg"></p>
        </div>
      </div>
      <div class="editor-container hidden">
        <textarea id="editor" class="editor editor-textarea" aria-label="Editor" spellcheck="false"></textarea>
      </div>
      <div class="iframe-container"></div>
    </div>
  </main>

  <!-- Data template -->
  <template id="index-data">__INDEX_DATA__</template>
  <script src="__ASSETS_PREFIX__index.js"></script>
</body>
</html>
